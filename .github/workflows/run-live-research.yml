name: Run Live Research Now

on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "45 2 * * *"
    - cron: "30 14 * * *"
    - cron: "45 14 * * *"
    # Research Gap scheduled ownership is Vercel-primary. GitHub retains
    # workflow_dispatch research_gap_cycle as an audited manual fallback.
  workflow_dispatch:
    inputs:
      mode:
        description: Production action to run
        required: true
        type: choice
        default: research
        options:
          - research
          - intelligence_only
          - story_maintenance
          - regime_shadow
          - research_gap_one
          - research_gap_handoff_one
          - research_gap_cycle
          - dossier_v2_dry_run
          - dossier_v2_persist
          - verified_macro_signals
          - finra_sensor
      slot:
        description: Production research slot to run (research mode)
        required: true
        type: choice
        default: morning
        options:
          - morning
          - evening
      retry_key:
        description: Optional audited manual identity (auto-generated when empty)
        required: false
        type: string
        default: ""
      research_gap_case_id:
        description: Optional exact Research Gap case UUID (research_gap_handoff_one mode)
        required: false
        type: string
        default: ""
      finra_trade_date:
        description: FINRA trade date YYYY-MM-DD (finra_sensor mode)
        required: false
        type: string
        default: ""
      dossier_as_of:
        description: Optional ISO as-of timestamp (Dossier V2 modes; blank uses server time)
        required: false
        type: string
        default: ""
      dossier_lookback_hours:
        description: Canonical evidence lookback hours, 1-720
        required: false
        type: string
        default: "168"
      dossier_evidence_limit:
        description: Canonical evidence row cap, 1-500
        required: false
        type: string
        default: "180"
      dossier_strategy:
        description: Dossier V2 persistence strategy
        required: false
        type: choice
        default: auto
        options:
          - auto
          - rebase
      verified_macro_signals_json:
        description: JSON object with 1-6 provenance-backed macro signals (verified_macro_signals mode)
        required: false
        type: string
        default: ""
      finra_symbols:
        description: Macro FINRA proxy basket, max 20 (finra_sensor mode)
        required: false
        type: string
        default: "SPY,QQQ,IWM,TLT,IEF,HYG,LQD,UUP,FXY,EWJ,EWY,EWH,GLD,SMH,USL,CRAK,XLE,KRE,XLF,EEM"

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-live-research
  cancel-in-progress: false

jobs:
  run-production-cron:
    name: Run ${{ github.event_name == 'schedule' && 'research' || inputs.mode }} production action
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROD_URL: https://alchemy-live-market-desk.vercel.app
      MODE: ${{ github.event_name == 'schedule' && 'research' || inputs.mode }}
      SLOT: ${{ inputs.slot }}
      CRON_SCHEDULE: ${{ github.event.schedule }}
      RETRY_KEY: ${{ inputs.retry_key }}
      RESEARCH_GAP_CASE_ID: ${{ inputs.research_gap_case_id }}
      FINRA_TRADE_DATE: ${{ inputs.finra_trade_date }}
      FINRA_SYMBOLS: ${{ inputs.finra_symbols }}
      DOSSIER_AS_OF: ${{ inputs.dossier_as_of }}
      DOSSIER_LOOKBACK_HOURS: ${{ inputs.dossier_lookback_hours }}
      DOSSIER_EVIDENCE_LIMIT: ${{ inputs.dossier_evidence_limit }}
      DOSSIER_STRATEGY: ${{ inputs.dossier_strategy }}
      VERIFIED_MACRO_SIGNALS_JSON: ${{ inputs.verified_macro_signals_json }}
      OIDC_AUDIENCE: alchemy-live-market-desk:manual-research
    steps:
      - name: Resolve audited manual identity
        if: ${{ env.MODE == 'research' || env.MODE == 'intelligence_only' || env.MODE == 'story_maintenance' }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            case "$CRON_SCHEDULE" in
              "30 2 * * *"|"45 2 * * *")
                SLOT="morning"
                ;;
              "30 14 * * *"|"45 14 * * *")
                SLOT="evening"
                ;;
              *)
                echo "Unrecognised production schedule: ${CRON_SCHEDULE:-missing}" >&2
                exit 1
                ;;
            esac
            RETRY_KEY="github-scheduled"
          elif [[ -z "$RETRY_KEY" ]]; then
            RETRY_KEY="live-manual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          if [[ ! "$RETRY_KEY" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,40}$ ]]; then
            echo "retry_key must contain only letters, numbers, and hyphens and be at most 41 characters." >&2
            exit 1
          fi
          echo "SLOT=$SLOT" >> "$GITHUB_ENV"
          echo "RETRY_KEY=$RETRY_KEY" >> "$GITHUB_ENV"
          echo "Production research identity: slot=$SLOT retry=$RETRY_KEY schedule=${CRON_SCHEDULE:-manual}"

      - name: Run canonical production pipeline
        if: ${{ env.MODE == 'research' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          request_oidc_token() {
            local encoded_audience response
            encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
            response="$(curl --fail --silent --show-error \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
            OIDC_TOKEN="$(jq -er '.value' <<<"$response")"
            echo "::add-mask::$OIDC_TOKEN"
          }

          invoke_stage() {
            local stage="$1" body http_status
            request_oidc_token
            body="$(jq -cn \
              --arg slot "$SLOT" \
              --arg stage "$stage" \
              --arg retryKey "$RETRY_KEY" \
              '{slot:$slot,stage:$stage,retryKey:$retryKey}')"
            http_status="$(curl --silent --show-error --max-time 305 \
              -o "$RESPONSE_FILE" -w '%{http_code}' \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$body" \
              "$PROD_URL/api/admin/research/run")"
            jq -c '{status,slot,runKey,runId,scheduledFor,updatesPublished,message,intelligenceStatus:.intelligence.status}' "$RESPONSE_FILE"
            if [[ ! "$http_status" =~ ^2 ]]; then
              echo "Manual Live $stage invocation returned HTTP $http_status." >&2
              exit 1
            fi
          }

          invoke_stage acquisition
          acquisition_state="$(jq -r '.status // empty' "$RESPONSE_FILE")"
          acquisition_message="$(jq -r '.message // empty' "$RESPONSE_FILE")"
          if [[ "$acquisition_state" == "not_retried" ]]; then
            if [[ "$acquisition_message" == *"terminal state"* ]]; then
              echo "Scheduled fallback found a terminal prior run: $acquisition_message" >&2
              exit 1
            fi
            echo "Scheduled fallback no-op: the canonical slot already completed."
            exit 0
          fi

          for attempt in {1..8}; do
            echo "Intelligence continuation attempt $attempt"
            invoke_stage intelligence
            state="$(jq -r '.status // empty' "$RESPONSE_FILE")"
            case "$state" in
              completed)
                exit 0
                ;;
              partial|intelligence_running|acquisition_pending)
                sleep 15
                ;;
              blocked|failed|terminal|missing)
                echo "Canonical intelligence ended in state: $state" >&2
                exit 1
                ;;
              *)
                echo "Unexpected canonical intelligence state: ${state:-missing}" >&2
                exit 1
                ;;
            esac
          done

          echo "Canonical intelligence did not complete within eight continuations." >&2
          exit 1

      - name: Run token-aware Dossier V2 handoff
        if: ${{ env.MODE == 'research' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/dossier-v2-auto-handoff.json"

          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"

          lookback_hours="${DOSSIER_LOOKBACK_HOURS:-168}"
          evidence_limit="${DOSSIER_EVIDENCE_LIMIT:-180}"
          if [[ ! "$lookback_hours" =~ ^[0-9]+$ ]] || (( lookback_hours < 1 || lookback_hours > 720 )); then
            echo "Automatic Dossier lookback must be an integer from 1 to 720." >&2
            exit 1
          fi
          if [[ ! "$evidence_limit" =~ ^[0-9]+$ ]] || (( evidence_limit < 1 || evidence_limit > 500 )); then
            echo "Automatic Dossier evidence limit must be an integer from 1 to 500." >&2
            exit 1
          fi

          body="$(jq -cn \
            --argjson lookbackHours "$lookback_hours" \
            --argjson evidenceLimit "$evidence_limit" \
            '{strategy:"auto",lookbackHours:$lookbackHours,evidenceLimit:$evidenceLimit}')"

          http_status="$(curl --silent --show-error --max-time 305 \
            -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data "$body" \
            "$PROD_URL/api/admin/dossier-v2/run")"

          jq -c '{
            status,
            mode,
            strategy,
            dossierDecision,
            persistedDossier,
            currentDossier,
            packetSummary: {
              packetId: .packetSummary.packetId,
              asOf: .packetSummary.asOf,
              observedEvidence: .packetSummary.observedEvidence,
              researchLeads: .packetSummary.researchLeads,
              developmentClusters: .packetSummary.developmentClusters
            }
          }' "$RESPONSE_FILE"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "Automatic Dossier V2 handoff returned HTTP $http_status." >&2
            exit 1
          fi
          state="$(jq -r '.status // empty' "$RESPONSE_FILE")"
          if [[ "$state" != "completed" ]]; then
            echo "Automatic Dossier V2 handoff ended in state: ${state:-missing}" >&2
            exit 1
          fi

      - name: Run canonical intelligence only
        if: ${{ env.MODE == 'intelligence_only' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          request_oidc_token() {
            local encoded_audience response
            encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
            response="$(curl --fail --silent --show-error \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
            OIDC_TOKEN="$(jq -er '.value' <<<"$response")"
            echo "::add-mask::$OIDC_TOKEN"
          }

          invoke_intelligence() {
            local body http_status
            request_oidc_token
            body="$(jq -cn \
              --arg slot "$SLOT" \
              --arg retryKey "$RETRY_KEY" \
              '{slot:$slot,stage:"intelligence",retryKey:$retryKey}')"
            http_status="$(curl --silent --show-error --max-time 305 \
              -o "$RESPONSE_FILE" -w '%{http_code}' \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$body" \
              "$PROD_URL/api/admin/research/run")"
            jq -c '{status,slot,runKey,runId,scheduledFor,updatesPublished,message,intelligenceStatus:.intelligence.status}' "$RESPONSE_FILE"
            if [[ ! "$http_status" =~ ^2 ]]; then
              echo "Manual Live intelligence invocation returned HTTP $http_status." >&2
              exit 1
            fi
          }

          for attempt in {1..8}; do
            echo "Intelligence-only continuation attempt $attempt"
            invoke_intelligence
            state="$(jq -r '.status // empty' "$RESPONSE_FILE")"
            case "$state" in
              completed)
                exit 0
                ;;
              partial|intelligence_running|acquisition_pending)
                sleep 15
                ;;
              blocked|failed|terminal|missing)
                echo "Canonical intelligence ended in state: $state" >&2
                exit 1
                ;;
              *)
                echo "Unexpected canonical intelligence state: ${state:-missing}" >&2
                exit 1
                ;;
            esac
          done

          echo "Canonical intelligence did not complete within eight continuations." >&2
          exit 1

      - name: Run Story maintenance only
        if: ${{ env.MODE == 'story_maintenance' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"

          body="$(jq -cn \
            --arg slot "$SLOT" \
            --arg retryKey "$RETRY_KEY" \
            '{slot:$slot,stage:"maintenance",retryKey:$retryKey}')"
          http_status="$(curl --silent --show-error --max-time 305 \
            -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data "$body" \
            "$PROD_URL/api/admin/research/run")"

          jq -c '{status,slot,runKey,engineRunId,storiesConsidered,storiesPublished,warnings}' "$RESPONSE_FILE"
          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "Story maintenance invocation returned HTTP $http_status." >&2
            exit 1
          fi
          state="$(jq -r '.status // empty' "$RESPONSE_FILE")"
          if [[ "$state" != "completed" ]]; then
            echo "Story maintenance ended in state: ${state:-missing}" >&2
            exit 1
          fi

      - name: Run Regime shadow projection
        if: ${{ env.MODE == 'regime_shadow' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/regime-shadow.json"

          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"

          trigger_ref="github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          body="$(jq -cn --arg triggerRef "$trigger_ref" '{triggerRef:$triggerRef}')"
          http_status="$(curl --silent --show-error --max-time 305 \
            -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data "$body" \
            "$PROD_URL/api/regime-shadow")"

          jq -c '{
            enabled,
            reused,
            runId,
            runKey,
            inputHash,
            projectedRegimes,
            versionIds,
            warnings
          }' "$RESPONSE_FILE"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "Regime shadow projection returned HTTP $http_status." >&2
            exit 1
          fi
          jq -e '.enabled == true and (.runId | type == "string" and length > 0)' "$RESPONSE_FILE" >/dev/null

      - name: Run one Research Gap web case
        if: ${{ env.MODE == 'research_gap_one' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/research-gap-one.json"

          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"

          http_status="$(curl --silent --show-error --max-time 305 \
            -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$PROD_URL/api/admin/research-gap/run-one")"

          jq -c '{
            status,
            caseId,
            gapKey,
            question,
            outcome,
            stopReason,
            confidence,
            evidenceCount,
            eligibleEvidenceCount,
            sourceCount,
            branchCount,
            missingRequirementIds,
            verdictVersion,
            evidenceSnapshotVersion,
            handoff,
            released,
            error,
            detail
          }' "$RESPONSE_FILE"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "Research Gap one-case executor returned HTTP $http_status." >&2
            exit 1
          fi
          state="$(jq -r '.status // empty' "$RESPONSE_FILE")"
          case "$state" in
            completed|empty)
              ;;
            *)
              echo "Research Gap one-case executor ended in state: ${state:-missing}" >&2
              exit 1
              ;;
          esac

      - name: Hand off one completed Research Gap case
        if: ${{ env.MODE == 'research_gap_handoff_one' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/research-gap-handoff-one.json"

          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"

          if [[ -n "$RESEARCH_GAP_CASE_ID" ]] && [[ ! "$RESEARCH_GAP_CASE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "research_gap_case_id must be a UUID when provided." >&2
            exit 1
          fi
          body="$(jq -cn --arg caseId "$RESEARCH_GAP_CASE_ID" 'if $caseId == "" then {} else {caseId:$caseId} end')"

          http_status="$(curl --silent --show-error --max-time 305 \
            -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data "$body" \
            "$PROD_URL/api/admin/research-gap/handoff-one")"

          jq -c '{
            status,
            caseId,
            gapKey,
            outcome,
            evidenceCount,
            runKey,
            canonicalStatus,
            canonicalRunId:.canonicalBody.runId,
            canonicalRunStatus:.canonicalBody.status,
            lifecycleStatus:.lifecycle.lifecycleStatus,
            lifecycleUpdate:.lifecycle.status,
            error
          }' "$RESPONSE_FILE"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "Research Gap snapshot handoff returned HTTP $http_status." >&2
            exit 1
          fi
          state="$(jq -r '.status // empty' "$RESPONSE_FILE")"
          case "$state" in
            handed_off|empty|closed_superseded)
              ;;
            *)
              echo "Research Gap snapshot handoff ended in state: ${state:-missing}" >&2
              exit 1
              ;;
          esac

      - name: Run one scheduled Research Gap cycle
        if: ${{ env.MODE == 'research_gap_cycle' }}
        shell: bash
        run: |
          set -euo pipefail
          HANDOFF_FILE="$RUNNER_TEMP/research-gap-cycle-handoff.json"
          RESEARCH_FILE="$RUNNER_TEMP/research-gap-cycle-research.json"

          request_oidc_token() {
            local encoded_audience response
            encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
            response="$(curl --fail --silent --show-error \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
            OIDC_TOKEN="$(jq -er '.value' <<<"$response")"
            echo "::add-mask::$OIDC_TOKEN"
          }

          invoke_json() {
            local endpoint="$1" body="$2" output="$3"
            request_oidc_token
            HTTP_STATUS="$(curl --silent --show-error --max-time 305 \
              -o "$output" -w '%{http_code}' \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$body" \
              "$PROD_URL$endpoint")"
          }

          # Retry a previously completed-but-unhanded case first. This keeps a
          # canonical outage from causing duplicate web research.
          invoke_json "/api/admin/research-gap/handoff-one" '{}' "$HANDOFF_FILE"
          jq -c '{status,caseId,gapKey,outcome,evidenceCount,runKey,canonicalStatus,lifecycleStatus:.lifecycle.lifecycleStatus,error}' "$HANDOFF_FILE"
          if [[ ! "$HTTP_STATUS" =~ ^2 ]]; then
            echo "Research Gap retry handoff returned HTTP $HTTP_STATUS." >&2
            exit 1
          fi
          handoff_state="$(jq -r '.status // empty' "$HANDOFF_FILE")"
          case "$handoff_state" in
            handed_off)
              echo "Research Gap cycle completed a pending canonical handoff; no new case will be researched."
              exit 0
              ;;
            empty|closed_superseded)
              ;;
            *)
              echo "Research Gap retry handoff ended in state: ${handoff_state:-missing}" >&2
              exit 1
              ;;
          esac

          # No completed case is awaiting admission: research exactly one queued case.
          invoke_json "/api/admin/research-gap/run-one" '{}' "$RESEARCH_FILE"
          jq -c '{status,caseId,gapKey,question,outcome,stopReason,confidence,evidenceCount,eligibleEvidenceCount,sourceCount,branchCount,missingRequirementIds,evidenceSnapshotVersion,released,error,detail}' "$RESEARCH_FILE"
          if [[ ! "$HTTP_STATUS" =~ ^2 ]]; then
            echo "Scheduled Research Gap executor returned HTTP $HTTP_STATUS." >&2
            exit 1
          fi
          research_state="$(jq -r '.status // empty' "$RESEARCH_FILE")"
          case "$research_state" in
            empty)
              echo "Research Gap cycle skipped: no queued case is claimable."
              exit 0
              ;;
            completed)
              ;;
            *)
              echo "Scheduled Research Gap executor ended in state: ${research_state:-missing}" >&2
              exit 1
              ;;
          esac

          case_id="$(jq -er '.caseId' "$RESEARCH_FILE")"
          handoff_body="$(jq -cn --arg caseId "$case_id" '{caseId:$caseId}')"

          # Hand off only the exact case completed above. If canonical Live fails,
          # the case remains COMPLETED and the next cycle retries it before research.
          invoke_json "/api/admin/research-gap/handoff-one" "$handoff_body" "$HANDOFF_FILE"
          jq -c '{status,caseId,gapKey,outcome,evidenceCount,runKey,canonicalStatus,canonicalRunId:.canonicalBody.runId,canonicalRunStatus:.canonicalBody.status,lifecycleStatus:.lifecycle.lifecycleStatus,error}' "$HANDOFF_FILE"
          if [[ ! "$HTTP_STATUS" =~ ^2 ]]; then
            echo "Scheduled Research Gap canonical handoff returned HTTP $HTTP_STATUS." >&2
            exit 1
          fi
          final_state="$(jq -r '.status // empty' "$HANDOFF_FILE")"
          if [[ "$final_state" != "handed_off" ]]; then
            echo "Scheduled Research Gap canonical handoff ended in state: ${final_state:-missing}" >&2
            exit 1
          fi

      - name: Run Dossier V2 production dry-run
        if: ${{ env.MODE == 'dossier_v2_dry_run' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/dossier-v2-dry-run.json"

          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"

          if [[ ! "$DOSSIER_LOOKBACK_HOURS" =~ ^[0-9]+$ ]] || (( DOSSIER_LOOKBACK_HOURS < 1 || DOSSIER_LOOKBACK_HOURS > 720 )); then
            echo "dossier_lookback_hours must be an integer from 1 to 720." >&2
            exit 1
          fi
          if [[ ! "$DOSSIER_EVIDENCE_LIMIT" =~ ^[0-9]+$ ]] || (( DOSSIER_EVIDENCE_LIMIT < 1 || DOSSIER_EVIDENCE_LIMIT > 500 )); then
            echo "dossier_evidence_limit must be an integer from 1 to 500." >&2
            exit 1
          fi

          if [[ -n "$DOSSIER_AS_OF" ]]; then
            body="$(jq -cn \
              --arg asOf "$DOSSIER_AS_OF" \
              --argjson lookbackHours "$DOSSIER_LOOKBACK_HOURS" \
              --argjson evidenceLimit "$DOSSIER_EVIDENCE_LIMIT" \
              '{asOf:$asOf,lookbackHours:$lookbackHours,evidenceLimit:$evidenceLimit}')"
          else
            body="$(jq -cn \
              --argjson lookbackHours "$DOSSIER_LOOKBACK_HOURS" \
              --argjson evidenceLimit "$DOSSIER_EVIDENCE_LIMIT" \
              '{lookbackHours:$lookbackHours,evidenceLimit:$evidenceLimit}')"
          fi

          http_status="$(curl --silent --show-error --max-time 305 \
            -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data "$body" \
            "$PROD_URL/api/admin/dossier-v2/dry-run")"

          jq -c '{
            status,
            mode,
            persistenceAvailable,
            previousDossierId,
            snapshotDiagnostics,
            packetSummary: {
              packetId: .packetSummary.packetId,
              asOf: .packetSummary.asOf,
              observedEvidence: .packetSummary.observedEvidence,
              researchLeads: .packetSummary.researchLeads,
              catalysts: .packetSummary.catalysts,
              freshnessWarnings: .packetSummary.freshnessWarnings,
              researchGaps: .packetSummary.researchGaps
            },
            mainThread: .analyticalOutput.main_thread,
            diagnostics: .analyticalOutput.diagnostics
          }' "$RESPONSE_FILE"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "Dossier V2 dry-run returned HTTP $http_status." >&2
            exit 1
          fi

      - name: Upload Dossier V2 dry-run artifact
        if: ${{ env.MODE == 'dossier_v2_dry_run' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dossier-v2-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dossier-v2-dry-run.json
          if-no-files-found: error
          retention-days: 7


      - name: Run Dossier V2 production persistence proof
        if: ${{ env.MODE == 'dossier_v2_persist' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/dossier-v2-persist.json"

          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"

          if [[ ! "$DOSSIER_LOOKBACK_HOURS" =~ ^[0-9]+$ ]] || (( DOSSIER_LOOKBACK_HOURS < 1 || DOSSIER_LOOKBACK_HOURS > 720 )); then
            echo "dossier_lookback_hours must be an integer from 1 to 720." >&2
            exit 1
          fi
          if [[ ! "$DOSSIER_EVIDENCE_LIMIT" =~ ^[0-9]+$ ]] || (( DOSSIER_EVIDENCE_LIMIT < 1 || DOSSIER_EVIDENCE_LIMIT > 500 )); then
            echo "dossier_evidence_limit must be an integer from 1 to 500." >&2
            exit 1
          fi

          if [[ -n "$DOSSIER_AS_OF" ]]; then
            body="$(jq -cn \
              --arg asOf "$DOSSIER_AS_OF" \
              --arg strategy "$DOSSIER_STRATEGY" \
              --argjson lookbackHours "$DOSSIER_LOOKBACK_HOURS" \
              --argjson evidenceLimit "$DOSSIER_EVIDENCE_LIMIT" \
              '{asOf:$asOf,strategy:$strategy,lookbackHours:$lookbackHours,evidenceLimit:$evidenceLimit}')"
          else
            body="$(jq -cn \
              --arg strategy "$DOSSIER_STRATEGY" \
              --argjson lookbackHours "$DOSSIER_LOOKBACK_HOURS" \
              --argjson evidenceLimit "$DOSSIER_EVIDENCE_LIMIT" \
              '{strategy:$strategy,lookbackHours:$lookbackHours,evidenceLimit:$evidenceLimit}')"
          fi

          http_status="$(curl --silent --show-error --max-time 305 \
            -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data "$body" \
            "$PROD_URL/api/admin/dossier-v2/run")"

          jq -c '{
            status,
            mode,
            strategy,
            persistenceAvailable,
            previousDossierId,
            dossierDecision,
            persistedDossier,
            currentDossier,
            snapshotDiagnostics,
            packetSummary: {
              packetId: .packetSummary.packetId,
              asOf: .packetSummary.asOf,
              observedEvidence: .packetSummary.observedEvidence,
              researchLeads: .packetSummary.researchLeads,
              catalysts: .packetSummary.catalysts,
              freshnessWarnings: .packetSummary.freshnessWarnings,
              researchGaps: .packetSummary.researchGaps
            },
            mainThread: .analyticalOutput.main_thread,
            diagnostics: .analyticalOutput.diagnostics
          }' "$RESPONSE_FILE"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "Dossier V2 persistence proof returned HTTP $http_status." >&2
            exit 1
          fi

      - name: Upload Dossier V2 persistence artifact
        if: ${{ env.MODE == 'dossier_v2_persist' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dossier-v2-persist-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dossier-v2-persist.json
          if-no-files-found: error
          retention-days: 7

      - name: Ingest verified macro signals
        if: ${{ env.MODE == 'verified_macro_signals' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$VERIFIED_MACRO_SIGNALS_JSON" ]]; then
            echo "verified_macro_signals_json is required." >&2
            exit 1
          fi
          jq -e '.signals | type == "array" and length >= 1 and length <= 6' <<<"$VERIFIED_MACRO_SIGNALS_JSON" >/dev/null

          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
          oidc_response="$(curl --fail --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error --max-time 65             -o "$response_file" -w '%{http_code}'             -H "Authorization: Bearer $oidc_token"             -H "Content-Type: application/json"             --data "$VERIFIED_MACRO_SIGNALS_JSON"             "$PROD_URL/api/admin/dossier-v2/verified-macro-signals")"
          jq -c '{status,signals,error}' "$response_file"
          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "Verified macro signal ingestion returned HTTP $http_status." >&2
            exit 1
          fi

      - name: Run FINRA sensor-memory production proof
        if: ${{ env.MODE == 'finra_sensor' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$FINRA_TRADE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "finra_trade_date must be YYYY-MM-DD." >&2
            exit 1
          fi
          if [[ -z "$FINRA_SYMBOLS" ]]; then
            echo "finra_symbols is required." >&2
            exit 1
          fi

          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"

          symbols_json="$(jq -cn --arg value "$FINRA_SYMBOLS" '$value | split(",") | map(gsub("^\\s+|\\s+$"; ""))')"
          body="$(jq -cn \
            --arg tradeDate "$FINRA_TRADE_DATE" \
            --argjson symbols "$symbols_json" \
            '{tradeDate:$tradeDate,symbols:$symbols}')"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error --max-time 305 \
            -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data "$body" \
            "$PROD_URL/api/admin/sensors/finra/run")"
          jq -c '{status,tradeDate,symbols,rowsFetched,sourceUrl,memory,note,error}' "$response_file"
          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "FINRA sensor-memory proof returned HTTP $http_status." >&2
            exit 1
          fi