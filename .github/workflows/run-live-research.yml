name: Run Live Research Now

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Production action to run
        required: true
        type: choice
        default: research
        options:
          - research
          - intelligence_only
          - story_maintenance
          - dossier_v2_dry_run
          - dossier_v2_persist
          - finra_sensor
      slot:
        description: Production research slot to run (research mode)
        required: true
        type: choice
        default: morning
        options:
          - morning
          - evening
      retry_key:
        description: Optional audited manual identity (auto-generated when empty)
        required: false
        type: string
        default: ""
      finra_trade_date:
        description: FINRA trade date YYYY-MM-DD (finra_sensor mode)
        required: false
        type: string
        default: ""
      dossier_as_of:
        description: Optional ISO as-of timestamp (Dossier V2 modes; blank uses server time)
        required: false
        type: string
        default: ""
      dossier_lookback_hours:
        description: Canonical evidence lookback hours, 1-720
        required: false
        type: string
        default: "168"
      dossier_evidence_limit:
        description: Canonical evidence row cap, 1-500
        required: false
        type: string
        default: "180"
      finra_symbols:
        description: Macro FINRA proxy basket, max 20 (finra_sensor mode)
        required: false
        type: string
        default: "SPY,QQQ,IWM,TLT,IEF,HYG,LQD,UUP,FXY,EWJ,EWY,EWH,GLD,SMH,USL,CRAK,XLE,KRE,XLF,EEM"

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-live-research
  cancel-in-progress: false

jobs:
  run-production-cron:
    name: Run ${{ inputs.mode }} production action
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROD_URL: https://alchemy-live-market-desk.vercel.app
      SLOT: ${{ inputs.slot }}
      RETRY_KEY: ${{ inputs.retry_key }}
      FINRA_TRADE_DATE: ${{ inputs.finra_trade_date }}
      FINRA_SYMBOLS: ${{ inputs.finra_symbols }}
      DOSSIER_AS_OF: ${{ inputs.dossier_as_of }}
      DOSSIER_LOOKBACK_HOURS: ${{ inputs.dossier_lookback_hours }}
      DOSSIER_EVIDENCE_LIMIT: ${{ inputs.dossier_evidence_limit }}
      OIDC_AUDIENCE: alchemy-live-market-desk:manual-research
    steps:
      - name: Resolve audited manual identity
        if: ${{ inputs.mode == 'research' || inputs.mode == 'intelligence_only' || inputs.mode == 'story_maintenance' }}
        shell: bash
        run: |
          if [[ -z "$RETRY_KEY" ]]; then
            RETRY_KEY="live-manual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          if [[ ! "$RETRY_KEY" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,40}$ ]]; then
            echo "retry_key must contain only letters, numbers, and hyphens and be at most 41 characters." >&2
            exit 1
          fi
          echo "RETRY_KEY=$RETRY_KEY" >> "$GITHUB_ENV"
          echo "Manual research identity: $RETRY_KEY"

      - name: Run canonical production pipeline
        if: ${{ inputs.mode == 'research' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          request_oidc_token() {
            local encoded_audience response
            encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
            response="$(curl --fail --silent --show-error \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
            OIDC_TOKEN="$(jq -er '.value' <<<"$response")"
            echo "::add-mask::$OIDC_TOKEN"
          }

          invoke_stage() {
            local stage="$1" body http_status
            request_oidc_token
            body="$(jq -cn \
              --arg slot "$SLOT" \
              --arg stage "$stage" \
              --arg retryKey "$RETRY_KEY" \
              '{slot:$slot,stage:$stage,retryKey:$retryKey}')"
            http_status="$(curl --silent --show-error --max-time 305 \
              -o "$RESPONSE_FILE" -w '%{http_code}' \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$body" \
              "$PROD_URL/api/admin/research/run")"
            jq -c '{status,slot,runKey,runId,scheduledFor,updatesPublished,message,intelligenceStatus:.intelligence.status}' "$RESPONSE_FILE"
            if [[ ! "$http_status" =~ ^2 ]]; then
              echo "Manual Live $stage invocation returned HTTP $http_status." >&2
              exit 1
            fi
          }

          invoke_stage acquisition

          for attempt in {1..8}; do
            echo "Intelligence continuation attempt $attempt"
            invoke_stage intelligence
            state="$(jq -r '.status // empty' "$RESPONSE_FILE")"
            case "$state" in
              completed)
                exit 0
                ;;
              partial|intelligence_running|acquisition_pending)
                sleep 15
                ;;
              blocked|failed|terminal|missing)
                echo "Canonical intelligence ended in state: $state" >&2
                exit 1
                ;;
              *)
                echo "Unexpected canonical intelligence state: ${state:-missing}" >&2
                exit 1
                ;;
            esac
          done

          echo "Canonical intelligence did not complete within eight continuations." >&2
          exit 1

      - name: Run canonical intelligence only
        if: ${{ inputs.mode == 'intelligence_only' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          request_oidc_token() {
            local encoded_audience response
            encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
            response="$(curl --fail --silent --show-error \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
            OIDC_TOKEN="$(jq -er '.value' <<<"$response")"
            echo "::add-mask::$OIDC_TOKEN"
          }

          invoke_intelligence() {
            local body http_status
            request_oidc_token
            body="$(jq -cn \
              --arg slot "$SLOT" \
              --arg retryKey "$RETRY_KEY" \
              '{slot:$slot,stage:"intelligence",retryKey:$retryKey}')"
            http_status="$(curl --silent --show-error --max-time 305 \
              -o "$RESPONSE_FILE" -w '%{http_code}' \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$body" \
              "$PROD_URL/api/admin/research/run")"
            jq -c '{status,slot,runKey,runId,scheduledFor,updatesPublished,message,intelligenceStatus:.intelligence.status}' "$RESPONSE_FILE"
            if [[ ! "$http_status" =~ ^2 ]]; then
              echo "Manual Live intelligence invocation returned HTTP $http_status." >&2
              exit 1
            fi
          }

          for attempt in {1..8}; do
            echo "Intelligence-only continuation attempt $attempt"
            invoke_intelligence
            state="$(jq -r '.status // empty' "$RESPONSE_FILE")"
            case "$state" in
              completed)
                exit 0
                ;;
              partial|intelligence_running|acquisition_pending)
                sleep 15
                ;;
              blocked|failed|terminal|missing)
                echo "Canonical intelligence ended in state: $state" >&2
                exit 1
                ;;
              *)
                echo "Unexpected canonical intelligence state: ${state:-missing}" >&2
                exit 1
                ;;
            esac
          done

          echo "Canonical intelligence did not complete within eight continuations." >&2
          exit 1

      - name: Run Story maintenance only
        if: ${{ inputs.mode == 'story_maintenance' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"

          body="$(jq -cn \
            --arg slot "$SLOT" \
            --arg retryKey "$RETRY_KEY" \
            '{slot:$slot,stage:"maintenance",retryKey:$retryKey}')"
          http_status="$(curl --silent --show-error --max-time 305 \
            -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data "$body" \
            "$PROD_URL/api/admin/research/run")"

          jq -c '{status,slot,runKey,engineRunId,storiesConsidered,storiesPublished,warnings}' "$RESPONSE_FILE"
          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "Story maintenance invocation returned HTTP $http_status." >&2
            exit 1
          fi
          state="$(jq -r '.status // empty' "$RESPONSE_FILE")"
          if [[ "$state" != "completed" ]]; then
            echo "Story maintenance ended in state: ${state:-missing}" >&2
            exit 1
          fi

      - name: Run Dossier V2 production dry-run
        if: ${{ inputs.mode == 'dossier_v2_dry_run' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/dossier-v2-dry-run.json"

          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"

          if [[ ! "$DOSSIER_LOOKBACK_HOURS" =~ ^[0-9]+$ ]] || (( DOSSIER_LOOKBACK_HOURS < 1 || DOSSIER_LOOKBACK_HOURS > 720 )); then
            echo "dossier_lookback_hours must be an integer from 1 to 720." >&2
            exit 1
          fi
          if [[ ! "$DOSSIER_EVIDENCE_LIMIT" =~ ^[0-9]+$ ]] || (( DOSSIER_EVIDENCE_LIMIT < 1 || DOSSIER_EVIDENCE_LIMIT > 500 )); then
            echo "dossier_evidence_limit must be an integer from 1 to 500." >&2
            exit 1
          fi

          if [[ -n "$DOSSIER_AS_OF" ]]; then
            body="$(jq -cn \
              --arg asOf "$DOSSIER_AS_OF" \
              --argjson lookbackHours "$DOSSIER_LOOKBACK_HOURS" \
              --argjson evidenceLimit "$DOSSIER_EVIDENCE_LIMIT" \
              '{asOf:$asOf,lookbackHours:$lookbackHours,evidenceLimit:$evidenceLimit}')"
          else
            body="$(jq -cn \
              --argjson lookbackHours "$DOSSIER_LOOKBACK_HOURS" \
              --argjson evidenceLimit "$DOSSIER_EVIDENCE_LIMIT" \
              '{lookbackHours:$lookbackHours,evidenceLimit:$evidenceLimit}')"
          fi

          http_status="$(curl --silent --show-error --max-time 305 \
            -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data "$body" \
            "$PROD_URL/api/admin/dossier-v2/dry-run")"

          jq -c '{
            status,
            mode,
            persistenceAvailable,
            previousDossierId,
            snapshotDiagnostics,
            packetSummary: {
              packetId: .packetSummary.packetId,
              asOf: .packetSummary.asOf,
              observedEvidence: .packetSummary.observedEvidence,
              researchLeads: .packetSummary.researchLeads,
              catalysts: .packetSummary.catalysts,
              freshnessWarnings: .packetSummary.freshnessWarnings,
              researchGaps: .packetSummary.researchGaps
            },
            mainThread: .analyticalOutput.main_thread,
            diagnostics: .analyticalOutput.diagnostics
          }' "$RESPONSE_FILE"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "Dossier V2 dry-run returned HTTP $http_status." >&2
            exit 1
          fi

      - name: Upload Dossier V2 dry-run artifact
        if: ${{ inputs.mode == 'dossier_v2_dry_run' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dossier-v2-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dossier-v2-dry-run.json
          if-no-files-found: error
          retention-days: 7


      - name: Run Dossier V2 production persistence proof
        if: ${{ inputs.mode == 'dossier_v2_persist' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/dossier-v2-persist.json"

          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"

          if [[ ! "$DOSSIER_LOOKBACK_HOURS" =~ ^[0-9]+$ ]] || (( DOSSIER_LOOKBACK_HOURS < 1 || DOSSIER_LOOKBACK_HOURS > 720 )); then
            echo "dossier_lookback_hours must be an integer from 1 to 720." >&2
            exit 1
          fi
          if [[ ! "$DOSSIER_EVIDENCE_LIMIT" =~ ^[0-9]+$ ]] || (( DOSSIER_EVIDENCE_LIMIT < 1 || DOSSIER_EVIDENCE_LIMIT > 500 )); then
            echo "dossier_evidence_limit must be an integer from 1 to 500." >&2
            exit 1
          fi

          if [[ -n "$DOSSIER_AS_OF" ]]; then
            body="$(jq -cn \
              --arg asOf "$DOSSIER_AS_OF" \
              --argjson lookbackHours "$DOSSIER_LOOKBACK_HOURS" \
              --argjson evidenceLimit "$DOSSIER_EVIDENCE_LIMIT" \
              '{asOf:$asOf,lookbackHours:$lookbackHours,evidenceLimit:$evidenceLimit}')"
          else
            body="$(jq -cn \
              --argjson lookbackHours "$DOSSIER_LOOKBACK_HOURS" \
              --argjson evidenceLimit "$DOSSIER_EVIDENCE_LIMIT" \
              '{lookbackHours:$lookbackHours,evidenceLimit:$evidenceLimit}')"
          fi

          http_status="$(curl --silent --show-error --max-time 305 \
            -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data "$body" \
            "$PROD_URL/api/admin/dossier-v2/run")"

          jq -c '{
            status,
            mode,
            persistenceAvailable,
            previousDossierId,
            persistedDossier,
            snapshotDiagnostics,
            packetSummary: {
              packetId: .packetSummary.packetId,
              asOf: .packetSummary.asOf,
              observedEvidence: .packetSummary.observedEvidence,
              researchLeads: .packetSummary.researchLeads,
              catalysts: .packetSummary.catalysts,
              freshnessWarnings: .packetSummary.freshnessWarnings,
              researchGaps: .packetSummary.researchGaps
            },
            mainThread: .analyticalOutput.main_thread,
            diagnostics: .analyticalOutput.diagnostics
          }' "$RESPONSE_FILE"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "Dossier V2 persistence proof returned HTTP $http_status." >&2
            exit 1
          fi

      - name: Upload Dossier V2 persistence artifact
        if: ${{ inputs.mode == 'dossier_v2_persist' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dossier-v2-persist-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dossier-v2-persist.json
          if-no-files-found: error
          retention-days: 7

      - name: Run FINRA sensor-memory production proof
        if: ${{ inputs.mode == 'finra_sensor' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$FINRA_TRADE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "finra_trade_date must be YYYY-MM-DD." >&2
            exit 1
          fi
          if [[ -z "$FINRA_SYMBOLS" ]]; then
            echo "finra_symbols is required." >&2
            exit 1
          fi

          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          echo "::add-mask::$oidc_token"

          symbols_json="$(jq -cn --arg value "$FINRA_SYMBOLS" '$value | split(",") | map(gsub("^\\s+|\\s+$"; ""))')"
          body="$(jq -cn \
            --arg tradeDate "$FINRA_TRADE_DATE" \
            --argjson symbols "$symbols_json" \
            '{tradeDate:$tradeDate,symbols:$symbols}')"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error --max-time 305 \
            -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data "$body" \
            "$PROD_URL/api/admin/sensors/finra/run")"
          jq -c '{status,tradeDate,symbols,rowsFetched,sourceUrl,memory,note,error}' "$response_file"
          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "FINRA sensor-memory proof returned HTTP $http_status." >&2
            exit 1
          fi