name: Bluebelly public pages visual verification

on:
  pull_request:
    paths:
      - 'app/blue-desk/regime-watch/**'
      - 'app/blue-desk/learn/**'
      - 'app/blue-desk/blue-desk.module.css'
      - 'app/blue-desk/page.tsx'
      - 'app/blue-desk/market-first-home.module.css'
      - 'components/blue-desk/MarketWindowBars.tsx'
      - 'components/blue-desk/MarketWindowBars.module.css'
      - 'lib/bluebelly-market-bar-visuals.ts'
      - 'app/blue-desk/key-stories/**'
      - 'app/blue-desk/daily-report/**'
      - 'app/blue-desk/newsroom/**'
      - 'app/blue-desk/hormuz/**'
      - 'app/blue-desk/markets/**'
      - 'components/blue-desk/DecisionBrief.module.css'
      - 'components/blue-desk/BluebellyNewsWire.tsx'
      - 'components/blue-desk/ShortNewsRecap.tsx'
      - 'components/blue-desk/EarningsInvestorDeepDive.tsx'
      - 'components/blue-desk/EarningsInvestorDeepDive.module.css'
      - 'lib/bluebelly-market-consequence-read-model.ts'
      - 'lib/bluebelly-public-headline.ts'
      - 'lib/bluebelly-earnings-investor-stories.ts'
      - 'components/blue-desk/bluebelly-newswire.module.css'
      - 'app/bluebelly-tokens.css'
      - 'lib/bluebelly-fundamental-quickview.ts'
      - 'lib/bluebelly-regime-asset-context.ts'
      - 'scripts/bluebelly-regime-ui-smoke.mjs'
      - '.github/workflows/bluebelly-regime-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bluebelly-regime-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production Next app (no deploy)
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Check real public/owner route behavior and render desktop/mobile
        run: node scripts/bluebelly-regime-ui-smoke.mjs
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Upload screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regime-watch-desktop-mobile-${{ github.run_id }}
          path: artifacts/regime-ui/*.png
          if-no-files-found: warn
          retention-days: 7
