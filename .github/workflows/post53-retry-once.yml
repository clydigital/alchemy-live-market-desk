name: Post53 Production Retry Once

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  post53-production-retry:
    if: contains(github.event.head_commit.message, '[post53-retry]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_9AogaVT7XiFYay1fSAuBoix9
      VERCEL_PROJECT_ID: prj_mHZ3Tosmi2iHCFthG4Eok8BLnWlq
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Confirm Vercel token is configured
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "Missing required repository secret: VERCEL_TOKEN." >&2
            exit 1
          fi

      - name: Invoke audited morning acquisition retry
        shell: bash
        run: >-
          npx --yes vercel@latest crons run "/api/cron/research/morning?retry=post53-test"
          --token "$VERCEL_TOKEN"
          --project "$VERCEL_PROJECT_ID"
          --scope "rogue-magazine"

      - name: Invoke matching intelligence continuation
        shell: bash
        run: >-
          npx --yes vercel@latest crons run "/api/cron/research/morning-intelligence?retry=post53-test"
          --token "$VERCEL_TOKEN"
          --project "$VERCEL_PROJECT_ID"
          --scope "rogue-magazine"
