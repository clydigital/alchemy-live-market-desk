name: Validate PR 141

on:
  push:
    branches:
      - codex/market-theme-taxonomy-20260907
    paths:
      - .github/workflows/validate-pr-141.yml

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/market-theme-taxonomy-20260907
      - name: Diagnostic release gate
        run: |
          set +e
          LOG=.validate-pr-141.log
          : > "$LOG"
          npm install --no-package-lock >> "$LOG" 2>&1
          INSTALL=$?
          npx tsc --noEmit >> "$LOG" 2>&1
          TSC=$?
          npm test >> "$LOG" 2>&1
          TEST=$?
          npm run build >> "$LOG" 2>&1
          BUILD=$?
          echo "install=$INSTALL tsc=$TSC test=$TEST build=$BUILD" >> "$LOG"
          if [ "$INSTALL" -eq 0 ] && [ "$TSC" -eq 0 ] && [ "$TEST" -eq 0 ] && [ "$BUILD" -eq 0 ]; then
            echo "VALIDATION_STATUS=0" >> "$GITHUB_ENV"
          else
            echo "VALIDATION_STATUS=1" >> "$GITHUB_ENV"
          fi
          exit 0
      - name: Persist result and clean successful run
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- tsconfig.tsbuildinfo
          if [ "${VALIDATION_STATUS}" = "0" ]; then
            rm -f .validate-pr-141.log .github/workflows/validate-pr-141.yml
          fi
          git add -A
          git commit -m "chore: record PR 141 validation result"
          git push origin HEAD:codex/market-theme-taxonomy-20260907
      - name: Fail when validation failed
        if: ${{ env.VALIDATION_STATUS != '0' }}
        run: exit 1
