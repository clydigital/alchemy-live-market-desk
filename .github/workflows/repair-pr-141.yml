# Final validation rerun after aligning the theme evidence fixture with current main.
name: Repair PR 141

on:
  push:
    branches:
      - codex/market-theme-taxonomy-20260907
    paths:
      - .github/workflows/repair-pr-141.yml

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/market-theme-taxonomy-20260907

      - name: Merge current main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge -X theirs --no-edit origin/main

      - name: Reapply feature and harden discovery registry
        run: python3 scripts/repair-pr-141.py

      - name: Validate repaired branch
        run: |
          set +e
          LOG=.repair-pr-141-validation.log
          : > "$LOG"
          npm install --no-package-lock >> "$LOG" 2>&1
          INSTALL=$?
          npx tsc --noEmit >> "$LOG" 2>&1
          TSC=$?
          npm test >> "$LOG" 2>&1
          TEST=$?
          npm run build >> "$LOG" 2>&1
          BUILD=$?
          echo "install=$INSTALL tsc=$TSC test=$TEST build=$BUILD" >> "$LOG"
          if [ "$INSTALL" -eq 0 ] && [ "$TSC" -eq 0 ] && [ "$TEST" -eq 0 ] && [ "$BUILD" -eq 0 ]; then
            echo "VALIDATION_STATUS=0" >> "$GITHUB_ENV"
          else
            echo "VALIDATION_STATUS=1" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Push repaired branch state
        run: |
          set -euo pipefail
          if [ "${VALIDATION_STATUS}" = "0" ]; then
            rm -f .repair-pr-141-validation.log .github/workflows/repair-pr-141.yml scripts/repair-pr-141.py
          fi
          git add -A
          git commit -m "repair: rebase PR 141 and harden discovery-only sources"
          git push origin HEAD:codex/market-theme-taxonomy-20260907

      - name: Fail run when validation failed
        if: ${{ env.VALIDATION_STATUS != '0' }}
        run: exit 1
