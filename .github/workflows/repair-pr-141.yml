name: Repair PR 141

on:
  push:
    branches:
      - codex/market-theme-taxonomy-20260907
    paths:
      - .github/workflows/repair-pr-141.yml

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/market-theme-taxonomy-20260907

      - name: Merge current main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge -X theirs --no-edit origin/main

      - name: Reapply feature and harden discovery registry
        run: python3 scripts/repair-pr-141.py

      - name: Validate repaired branch
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm test
          npm run build

      - name: Commit repaired branch
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-pr-141.yml scripts/repair-pr-141.py
          git add -A
          git commit -m "repair: rebase PR 141 and harden discovery-only sources"
          git push origin HEAD:codex/market-theme-taxonomy-20260907
