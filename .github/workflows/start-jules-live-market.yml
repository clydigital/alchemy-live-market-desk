name: Start Jules Live Market session

on:
  workflow_dispatch:
    inputs:
      jules_account:
        description: "Which Jules account should handle this session?"
        required: true
        default: "AMLYC"
        type: choice
        options:
          - AMLYC
          - LYC
      task:
        description: "Instruction for Jules (manual, plan approval required)"
        required: true
        type: string
        default: "Inspect the Live Desk architecture and identify where a presenter divergence card could fit. Return a plan only; do not modify code or production data."
      title:
        description: "Short session title"
        required: true
        type: string
        default: "Live Market: presenter divergence review"

permissions:
  contents: read

concurrency:
  group: manual-jules-live-market
  cancel-in-progress: false

jobs:
  start-session:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JULES_ACCOUNT: ${{ inputs.jules_account }}
      JULES_AMLYC: ${{ secrets.JULES_AMLYC }}
      JULES_LYC: ${{ secrets.JULES_LYC }}
      JULES_TASK: ${{ inputs.task }}
      JULES_TITLE: ${{ inputs.title }}
    steps:
      - name: Select Jules account and validate inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$JULES_ACCOUNT" in
            AMLYC)
              selected_key="$JULES_AMLYC"
              ;;
            LYC)
              selected_key="$JULES_LYC"
              ;;
            *)
              echo "Unsupported Jules account: $JULES_ACCOUNT" >&2
              exit 1
              ;;
          esac

          if [[ -z "$selected_key" ]]; then
            echo "The selected Jules account secret is not configured." >&2
            exit 1
          fi
          if [[ -z "${JULES_TASK//[[:space:]]/}" || -z "${JULES_TITLE//[[:space:]]/}" ]]; then
            echo "Task and title must contain text." >&2
            exit 1
          fi

          echo "::add-mask::$selected_key"
          echo "JULES_API_KEY=$selected_key" >> "$GITHUB_ENV"
          echo "Using Jules account label: $JULES_ACCOUNT"

      - name: Confirm Jules can access this repository
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_name=""
          page_token=""
          for page in {1..20}; do
            url="https://jules.googleapis.com/v1alpha/sources?pageSize=100"
            if [[ -n "$page_token" ]]; then
              url="$url&pageToken=$(jq -rn --arg value "$page_token" '$value|@uri')"
            fi
            response="$(curl --fail --silent --show-error --retry 2 \
              -H "X-Goog-Api-Key: $JULES_API_KEY" "$url")"
            source_name="$(jq -r --arg owner "$GITHUB_REPOSITORY_OWNER" \
              --arg repo "${GITHUB_REPOSITORY#*/}" \
              '.sources[]? | select(.githubRepo.owner == $owner and .githubRepo.repo == $repo) | .name' \
              <<<"$response" | head -n 1)"
            if [[ -n "$source_name" ]]; then
              break
            fi
            page_token="$(jq -r '.nextPageToken // empty' <<<"$response")"
            if [[ -z "$page_token" ]]; then
              break
            fi
          done
          if [[ -z "$source_name" ]]; then
            echo "This repository is not available as a Jules source for account $JULES_ACCOUNT." >&2
            exit 1
          fi
          echo "name=$source_name" >> "$GITHUB_OUTPUT"

      - name: Create approval-gated Jules session
        shell: bash
        env:
          JULES_SOURCE: ${{ steps.source.outputs.name }}
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg prompt "$JULES_TASK" \
            --arg title "$JULES_TITLE" \
            --arg source "$JULES_SOURCE" \
            --arg branch "$GITHUB_REF_NAME" \
            '{prompt:$prompt,title:$title,sourceContext:{source:$source,githubRepoContext:{startingBranch:$branch}},requirePlanApproval:true}')"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error \
            -o "$response_file" -w '%{http_code}' \
            -X POST "https://jules.googleapis.com/v1alpha/sessions" \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$payload")"
          if [[ ! "$status" =~ ^2 ]]; then
            echo "Jules session creation failed (HTTP $status)." >&2
            jq -r '.error.message // "No error detail returned"' "$response_file" >&2 || true
            exit 1
          fi
          session_name="$(jq -r '.name // empty' "$response_file")"
          if [[ ! "$session_name" =~ ^sessions/[A-Za-z0-9_-]+$ ]]; then
            echo "Jules returned an unexpected session identifier." >&2
            exit 1
          fi
          echo "Created Jules $session_name (plan approval required)."
          {
            echo "### Jules Live Market"
            echo "Account: `$JULES_ACCOUNT`"
            echo "Session: `$session_name`"
            echo "Source: `$JULES_SOURCE`"
            echo "Plan approval is required before Jules executes the task."
          } >> "$GITHUB_STEP_SUMMARY"
