name: Supabase daily keepalive
on:
  schedule:
    # Daily 03:20 UTC (11:20 MYT). External to Supabase.
    - cron: '20 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/supabase-deployment-health.py'
      - 'scripts/test-supabase-deployment-health.py'
      - '.github/workflows/supabase-daily-keepalive.yml'

permissions:
  contents: read

concurrency:
  group: supabase-daily-keepalive-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test readiness classifier
        run: python3 scripts/test-supabase-deployment-health.py
  probe:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify live database and each tracked project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/supabase-deployment-health.py
