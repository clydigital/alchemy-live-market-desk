name: Encrypted independent Supabase backup
on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.BLUEBELLY_BACKUP_DATABASE_URL }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BLUEBELLY_BACKUP_AGE_RECIPIENT }}
      BACKUP_REPO_TOKEN: ${{ secrets.BLUEBELLY_BACKUP_REPO_TOKEN }}
      BACKUP_REPO: ${{ vars.BLUEBELLY_BACKUP_REPO }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        run: |
          set -euo pipefail
          for key in DATABASE_URL BACKUP_AGE_RECIPIENT BACKUP_REPO_TOKEN BACKUP_REPO; do
            if [ -z "${!key:-}" ]; then echo "::error::Missing backup configuration: $key"; exit 1; fi
          done
      - name: Install encryption tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
      - name: Export, verify, encrypt, upload and prune
        run: bash scripts/backup-bluebelly.sh
