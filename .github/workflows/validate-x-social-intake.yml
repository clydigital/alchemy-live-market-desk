name: Validate X Social Intake

on:
  push:
    branches:
      - feat/x-social-intake-20260907

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/x-social-intake-20260907
          fetch-depth: 0

      - name: Apply deterministic implementation patches
        run: python .github/scripts/implement-x-social.py

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit implementation when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No implementation diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib tests docs supabase
          git commit -m "feat: wire X social discovery into Live intake"
          git push origin HEAD:feat/x-social-intake-20260907

# Validation marker: committed-state release gate.
