name: Validate Live Desk

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-live-desk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run full test suite
        run: npm test

      - name: Run Task C closure gate
        run: npm run test:task-c

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npx next build

  database-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap Supabase-compatible roles and extensions
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin;
            end if;
          end
          $$;
          create schema if not exists extensions;
          create extension if not exists pgcrypto with schema extensions;
          SQL

      - name: Load representative pre-MRU schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mru_pre_p1_schema_fixture.sql

      - name: Apply MRU P1 migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260908101500_durable_research_memory_p1.sql

      - name: Verify MRU P1 database contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/durable_research_memory_p1.sql

      - name: Apply MRU P2 provenance migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260908113000_provenance_complete_research_graph_p2.sql

      - name: Apply MRU P2 canonical-entity migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260908114500_provenance_canonical_entities_p2.sql

      - name: Verify MRU P2 database contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/provenance_complete_research_graph_p2.sql

      - name: Load material Story propagation fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/material_story_propagation_fixture.sql

      - name: Apply material Story propagation repair
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260908142909_repair_material_story_propagation.sql

      - name: Verify material Story propagation contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/material_story_propagation_contract.sql

      - name: Apply Market Dossiers V2 migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260915000000_market_dossiers_v2.sql

      - name: Verify Market Dossiers V2 database contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/market_dossiers_v2_contract.sql

      - name: Apply Research Gap lifecycle migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001061000_research_gap_lifecycle.sql

      - name: Verify Research Gap lifecycle database contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/research_gap_lifecycle_contract.sql

      - name: Apply Research Gap plan + verdict migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001063500_research_gap_plan_verdict.sql

      - name: Verify Research Gap plan + verdict database contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/research_gap_plan_verdict_contract.sql

      - name: Apply Research Gap handoff lifecycle migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001070500_research_gap_handoff_lifecycle.sql

      - name: Verify Research Gap handoff lifecycle database contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/research_gap_handoff_lifecycle_contract.sql

      - name: Bootstrap historical Regime migration dependency
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/regime_historical_dependency_fixture.sql

      - name: Apply persistent Regime shadow engine migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260928011010_persistent_regime_shadow_engine.sql

      - name: Apply persistent Regime FK indexes
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260928011605_persistent_regime_shadow_engine_fk_indexes.sql

      - name: Apply persistent Regime stale-run guard
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260928012228_persistent_regime_shadow_engine_stale_run_guard.sql

      - name: Verify persistent Regime shadow engine contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/persistent_regime_shadow_engine_contract.sql

      - name: Apply Market Motion v1 migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001012000_market_motion_v1.sql

      - name: Apply Market Motion 48h freshness migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001140700_market_motion_48h_window.sql

      - name: Verify Market Motion v1 database contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/market_motion_v1_contract.sql

      - name: Apply transcript Motion leads migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001143000_transcript_motion_leads.sql

      - name: Verify transcript Motion leads database contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/transcript_motion_leads_contract.sql
